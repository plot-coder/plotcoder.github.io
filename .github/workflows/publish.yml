# Publish the MCP server to npm on a version tag (R47), so an agent's wiring
# is `npx plotcoder-board` and never a clone.
#
# Trusted publishing: npm trusts this workflow by its identity (OIDC), set up
# once on the package's settings page at npmjs.com — organisation plot-coder,
# repository plotcoder.github.io, workflow publish.yml. No token in the
# repo's secrets. (If NPM_TOKEN is set anyway, npm uses it instead.)
name: Publish to npm
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
