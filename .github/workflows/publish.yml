# Publish the MCP server to npm on a version tag (R47), so an agent's wiring
# is `npx plotcoder-board` and never a clone. Needs NPM_TOKEN in the repo's
# secrets — an automation token from npmjs.com, Robert's, never in git.
name: Publish to npm
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
