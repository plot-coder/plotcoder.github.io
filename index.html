<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlotCoder</title>
    <meta name="description" content="A storylining app for screenwriters. Break story on a digital corkboard, then write." />
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        background: #11110f;
        color: #f4efe4;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      p.mark {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.75rem;
        color: #c4b59a;
        margin: 0 0 1rem;
      }
      h1 {
        font-size: clamp(2.4rem, 6vw, 4rem);
        font-weight: 400;
        margin: 0 0 0.75rem;
      }
      p.lede {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.5;
        color: #d8d0c2;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Storylining</p>
      <h1>PlotCoder</h1>
      <p class="lede">A digital corkboard for breaking and rearranging plot before you write the script.</p>
    </main>
  </body>
</html>
